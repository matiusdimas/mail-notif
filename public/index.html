<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailPulse Dashboard</title>
    <script>
        // Fix Traefik sub-path routing and relative assets
        const bp = window.location.pathname.includes('/mail-wa') ? '/mail-wa/' : '/';
        document.write('<base href="' + bp + '">');
        document.write('<script src="' + bp + 'socket.io/socket.io.js"><' + '/script>');
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Header -->
        <header class="header glass-panel">
            <div class="logo">
                <span class="icon">📬</span>
                <h1>MailPulse</h1>
            </div>
            <p class="subtitle">Smart Email Filter & Notifier</p>
            <div class="notification-settings">
                <div class="settings-group" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                    <button id="enable-system-btn" class="btn primary-btn">Enable Windows Notifications</button>
                    <p id="system-status-text" class="status-text warning">⚠️ Windows Notifications disabled</p>
                </div>
                
                <div class="settings-group" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                    <button id="enable-voice-btn" class="btn primary-btn">Enable Voice Notifications</button>
                    <div class="voice-picker">
                        <label for="voice-select">Suara</label>
                        <select id="voice-select"></select>
                        <button id="test-voice-btn" class="btn outline-btn" type="button">▶ Tes Suara</button>
                    </div>
                    <p id="voice-status-text" class="status-text warning">⚠️ Voice Auto-play requires interaction</p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Event Log Section -->
            <section class="section glass-panel">
                <div class="section-header">
                    <h2>Live Email Logs</h2>
                    <span class="live-indicator"></span>
                </div>
                <div class="log-container" id="log-container">
                    <p class="empty-log">Waiting for incoming emails...</p>
                </div>
            </section>

            <!-- Filters Management Section -->
            <section class="section glass-panel">
                <div class="section-header">
                    <h2>Blacklist Rules</h2>
                    <button id="add-filter-btn" class="btn action-btn">+ Add Rule</button>
                </div>
                
                <div class="filters-container" id="filters-container">
                    <!-- Filters will be injected here via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal for Adding/Editing Filter -->
    <div class="modal-overlay" id="filter-modal">
        <div class="modal glass-panel">
            <h2 id="modal-title">Add New Rule</h2>
            <form id="filter-form">
                <input type="hidden" id="filter-id">
                
                <div class="form-group">
                    <label>Rule Name</label>
                    <input type="text" id="filter-name" placeholder="e.g., Boss Emails" required>
                </div>

                <div class="form-group">
                    <label>Email Type</label>
                    <select id="filter-type" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white;">
                        <option value="both">Keduanya</option>
                        <option value="new">Email Baru Saja</option>
                        <option value="reply">Balasan / Terusan Saja</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Email To (Penerima)</label>
                    <input type="text" id="filter-to" placeholder="e.g., saya@company.com">
                </div>

                <div class="form-group">
                    <label>CC</label>
                    <input type="text" id="filter-cc" placeholder="e.g., cc@company.com">
                </div>

                <div class="form-group">
                    <label>Nama Pengirim</label>
                    <input type="text" id="filter-sender-name" placeholder="e.g., John Doe">
                </div>

                <div class="form-group">
                    <label>Email Pengirim</label>
                    <input type="text" id="filter-sender-email" placeholder="e.g., boss@company.com">
                </div>

                <div class="form-group">
                    <label>Subject Contains</label>
                    <input type="text" id="filter-subject" placeholder="e.g., URGENT">
                </div>

                <div class="form-group">
                    <label>Body Contains</label>
                    <input type="text" id="filter-body" placeholder="e.g., Action Required">
                </div>

                <div class="form-group row">
                    <label>Active</label>
                    <label class="switch">
                        <input type="checkbox" id="filter-active" checked>
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancel-btn" class="btn outline-btn">Cancel</button>
                    <button type="submit" class="btn primary-btn">Save Rule</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
