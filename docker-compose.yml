version: '3.8'

services:
  mail-wa:
    build: .
    container_name: mail-wa-app
    restart: unless-stopped
    ports:
      - "3005:3000"
    volumes:
      # Mount the database to persist filter configurations
      - ./database.sqlite:/usr/src/app/database.sqlite
    env_file:
      - .env
    networks:
      - proxy
      - mail-wa-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mail-wa.rule=Host(`web-support-portal.lmd.co.id`) && PathPrefix(`/mail-wa`)"
      - "traefik.http.routers.mail-wa.entrypoints=websecure"
      - "traefik.http.routers.mail-wa.tls=true"
      - "traefik.http.middlewares.mailwa-strip.stripprefix.prefixes=/mail-wa"
      # BasicAuth — scoped to THIS router only; does not affect other Traefik projects.
      # Credentials live in .env (gitignored) as MAILWA_AUTH_USERS=user:apr1hash
      # Generate: openssl passwd -apr1 'yourpass'  -> prefix with "user:" and DOUBLE every $ to $$
      # e.g.  MAILWA_AUTH_USERS=admin:$$apr1$$abc$$def   (verify with: docker compose config)
      - "traefik.http.middlewares.mailwa-auth.basicauth.users=${MAILWA_AUTH_USERS}"
      - "traefik.http.routers.mail-wa.middlewares=mailwa-strip,mailwa-auth"
      - "traefik.http.services.mail-wa.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
  mail-wa-internal:
    driver: bridge
